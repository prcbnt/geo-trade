name: Build trade data

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version BACI (ex. 202601) ou 'auto' pour la plus récente"
        required: false
        default: "auto"
  schedule:
    # Tous les ans le 20 février, 06:17 UTC (BACI sort fin janvier)
    - cron: "17 6 20 2 *"

permissions:
  contents: write
  pages: write

concurrency:
  group: build-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pandas numpy pycountry

      - name: Build data
        run: python scripts/build_data.py --version "${{ github.event.inputs.version || 'auto' }}" --out docs/data --cache "$RUNNER_TEMP"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "No change"
          else
            git commit -m "Data: CEPII BACI update"
            git push
          fi

      - name: Rebuild GitHub Pages
        # pushes made with GITHUB_TOKEN do not trigger the Pages build on their own
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages rebuild request failed"
