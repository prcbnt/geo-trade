<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Balances commerciales</title>
<style>
:root{--ink:#000;--paper:#fff;--g1:#f3f3f3;--g2:#dcdcdc;--g3:#9b9b9b;--g4:#5a5a5a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-size:14px;line-height:1.35;-webkit-font-smoothing:antialiased}
.wrap{max-width:1280px;margin:0 auto;padding:24px 16px 64px}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:16px}
header{border-bottom:2px solid var(--ink);padding-bottom:16px;margin-bottom:16px}
h1{grid-column:1/-1;font-size:44px;font-weight:700;letter-spacing:-.025em;line-height:.95;margin-bottom:20px}
.ctl{display:flex;flex-direction:column;gap:4px}
.ctl label,.lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.ctl input,.ctl select{font:inherit;font-size:16px;border:0;border-bottom:1px solid var(--ink);padding:6px 0;background:transparent;border-radius:0;-webkit-appearance:none;appearance:none;width:100%}
.ctl input:focus,.ctl select:focus{outline:none;border-bottom-width:2px}
.c-a{grid-column:span 4}.c-b{grid-column:span 4}.c-y{grid-column:span 2}.c-btn{grid-column:span 2;flex-direction:row;align-items:flex-end;gap:8px}
.c-mode{grid-column:span 8;margin-top:16px}.c-eu{grid-column:span 4;margin-top:16px;justify-content:flex-end}
.seg{display:flex}
.seg button+button{border-left:0}
button{font:inherit;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;border:1px solid var(--ink);background:var(--paper);color:var(--ink);padding:8px 10px;cursor:pointer;flex:1}
button:hover{background:var(--g1)}
button.on{background:var(--ink);color:var(--paper)}
#map{width:100%;display:block;cursor:pointer}
#map path.c{stroke:var(--paper);stroke-width:.5}
#map path.c:hover{stroke:var(--ink);stroke-width:1}
#map path.selA{stroke:var(--ink);stroke-width:1.5}
#map path.selB{stroke:var(--ink);stroke-width:2.5}
.legend{display:flex;flex-wrap:wrap;gap:16px;align-items:center;border-top:1px solid var(--ink);padding:8px 0 0;font-size:11px}
.legend .sw{display:inline-flex}
.legend svg{display:block}
.hint{font-size:12px;color:var(--g4)}
section{border-top:2px solid var(--ink);margin-top:32px;padding-top:12px}
h2{font-size:22px;font-weight:700;letter-spacing:-.01em;margin-bottom:16px}
h3{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.kpis{row-gap:16px}
.kpi{grid-column:span 3;border-top:1px solid var(--ink);padding-top:8px}
.kpi .v{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.05;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--g4);margin-top:2px}
.col6{grid-column:span 6}.col12{grid-column:1/-1}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td,th{padding:6px 0;border-bottom:1px solid var(--g2);vertical-align:top;text-align:left}
th{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--ink)}
td.n,th.n{text-align:right;white-space:nowrap;padding-left:12px}
tr.link{cursor:pointer}tr.link:hover td{background:var(--g1)}
.cat{display:grid;grid-template-columns:minmax(120px,1.3fr) 2fr 2fr minmax(70px,.6fr);column-gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid var(--g2);font-variant-numeric:tabular-nums}
.cat.hd{border-bottom:1px solid var(--ink);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.cat.sep{border-bottom:1px solid var(--ink);padding-top:16px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.bar{height:12px;position:relative}
.bar i{position:absolute;top:0;bottom:0;display:block}
.bar.l i{right:0;background:var(--g3)}
.bar.r i{left:0;background:var(--ink)}
.cat .n{text-align:right;font-size:12px}
.cat .lbl2{font-size:13px}
.sub{font-size:11px;color:var(--g4)}
.chart{width:100%;display:block}
.empty{color:var(--g4);padding:12px 0}
.note{border:1px solid var(--ink);padding:10px 12px;margin-top:16px;font-size:13px}
.note b{font-size:11px;text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:2px}
.note+.note{margin-top:8px}
#tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--paper);padding:6px 8px;font-size:12px;line-height:1.3;display:none;z-index:10;max-width:280px}
footer{border-top:2px solid var(--ink);margin-top:48px;padding-top:12px;font-size:11px;color:var(--g4);line-height:1.5}
footer p+p{margin-top:6px}
.load{font-size:12px;color:var(--g4);padding:8px 0}
@media (max-width:820px){
  h1{font-size:30px}
  .c-a,.c-b{grid-column:span 12;margin-bottom:12px}
  .c-y{grid-column:span 6}.c-btn{grid-column:span 6}
  .c-mode{grid-column:span 12}.c-eu{grid-column:span 12;margin-top:8px}
  .kpi{grid-column:span 6}
  .col6{grid-column:1/-1;margin-bottom:24px}
  .kpi .v{font-size:22px}
  .cat{grid-template-columns:1fr 1fr 64px;row-gap:4px}
  .cat .lbl2{grid-column:1/-1}
  .cat.hd .lbl2{display:none}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="grid">
      <h1>Balances commerciales bilatérales</h1>
      <div class="ctl c-a"><label for="inA">Pays A</label><input id="inA" list="dl" placeholder="Choisir ou cliquer sur la carte" autocomplete="off"></div>
      <div class="ctl c-b"><label for="inB">Pays B</label><input id="inB" list="dl" placeholder="Choisir ou cliquer sur la carte" autocomplete="off"></div>
      <div class="ctl c-y"><label for="year">Année</label><select id="year"></select></div>
      <div class="ctl c-btn"><button id="swap" title="Inverser A et B">A⇄B</button><button id="reset">Effacer</button></div>
      <div class="ctl c-mode"><span class="lbl">Périmètre</span><div class="seg" id="mode"><button data-m="g">Biens</button><button data-m="s">Services</button><button data-m="t">Total</button></div></div>
      <div class="ctl c-eu"><span class="lbl">Bloc</span><div class="seg"><button id="eu">UE-27</button></div></div>
      <datalist id="dl"></datalist>
    </div>
  </header>

  <svg id="map" role="img" aria-label="Carte du monde"></svg>
  <div class="legend" id="legend"></div>
  <div class="load" id="status">Chargement…</div>

  <div id="panel"></div>

  <footer id="foot"></footer>
</div>
<div id="tip"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
<script>
(async function(){
const S={meta:null,prod:null,cache:{},A:null,B:null,y:null,mode:'g',byKey:{},byNum:{},byName:{},members:new Set()};
const $=s=>document.querySelector(s);
const status=$('#status');
const nf1=new Intl.NumberFormat('fr-FR',{maximumFractionDigits:1});
const nf0=new Intl.NumberFormat('fr-FR',{maximumFractionDigits:0});
let dn=null;try{dn=new Intl.DisplayNames(['fr'],{type:'region'})}catch(e){}
const MODE={g:'biens',s:'services',t:'biens et services'};

// all values are thousands of USD
function fmt(v,signed){
  if(!v)return '0';
  const a=Math.abs(v)*1e3;let s;
  if(a>=1e9)s=(a>=1e11?nf0:nf1).format(a/1e9)+' Md$';
  else if(a>=1e6)s=(a>=1e8?nf0:nf1).format(a/1e6)+' M$';
  else s=nf0.format(a/1e3)+' k$';
  if(v<0)return '−'+s;
  return (signed&&v>0?'+':'')+s;
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sum=a=>a?a.reduce((x,y)=>x+y,0):0;
const name=k=>S.byKey[k]?S.byKey[k].fr:k;
const get=(F,f,y,p)=>F&&F[f]&&F[f][y]?F[f][y][p]:undefined;

async function getJSON(u){const r=await fetch(u);if(!r.ok)throw new Error(u+' '+r.status);return r.json()}
function load(k){
  if(!k)return Promise.resolve(null);
  if(!S.cache[k])S.cache[k]=getJSON('data/c/'+encodeURIComponent(k)+'.json').catch(()=>({}));
  return S.cache[k];
}

// ---------- init ----------
try{
  const [meta,world]=await Promise.all([getJSON('data/meta.json'),getJSON('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json')]);
  S.meta=meta;S.world=world;
}catch(e){
  status.textContent='Données introuvables. Lancez le workflow « Build trade data » dans l’onglet Actions du dépôt.';
  return;
}
getJSON('data/products.json').then(p=>{S.prod=p;render()}).catch(()=>{S.prod={}});
const EU=S.meta.eu||'EU27';
S.meta.syears=S.meta.syears||[];
for(const c of S.meta.countries){
  let fr=c.fr||c.n;
  if(!c.fr&&dn&&c.i2){try{const t=dn.of(c.i2);if(t&&t!==c.i2)fr=t}catch(e){}}
  c.fr=fr;
  S.byKey[c.k]=c;
  if(c.num)S.byNum[c.num]=c.k;
  for(const n of [fr,c.n,c.k])S.byName[n.toLowerCase()]=c.k;
  if(c.members)c.members.forEach(m=>S.members.add(m));
}
['ue','ue-27','ue27','eu','union européenne'].forEach(n=>S.byName[n]=EU);
const sorted=[...S.meta.countries].filter(c=>!/^C\d/.test(c.k)&&c.k!==EU).sort((a,b)=>a.fr.localeCompare(b.fr,'fr'));
$('#dl').innerHTML=[S.byKey[EU],...sorted].filter(Boolean).map(c=>`<option value="${esc(c.fr)}">`).join('');
const isEU=k=>k===EU, isMem=k=>S.members.has(k);
if(!S.meta.syears.length)$('#mode').style.display='none';

function yearsFor(m){
  const g=S.meta.years,s=S.meta.syears;
  if(m==='s')return s;
  if(m==='t')return g.filter(y=>s.includes(y));
  return g;
}
function fillYears(){
  const ys=[...yearsFor(S.mode)].sort((a,b)=>b-a);
  if(!ys.includes(+S.y))S.y=String(ys[0]);
  $('#year').innerHTML=ys.map(y=>`<option>${y}</option>`).join('');
  $('#year').value=S.y;
}
S.y=String(Math.max(...S.meta.years));

$('#foot').innerHTML=`<p>Biens : ${esc(S.meta.source)} (CEPII, licence Etalab 2.0). Flux réconciliés exportateur/importateur, valeurs FOB en dollars courants. La dernière année est provisoire.</p>
${S.meta.ssource?`<p>Services : ${esc(S.meta.ssource)}. Matrice équilibrée exportations = importations miroir. Une grande partie des flux bilatéraux est estimée par modèle (gravité, interpolation) et non déclarée par les pays : à lire comme un ordre de grandeur. Le statut « déclaré » ou « estimé » est indiqué pour chaque paire.</p>`:''}
<p>UE-27 : périmètre constant (27 membres actuels) sur toute la période, commerce extra-UE uniquement. Pour un pays membre, « UE-27 » désigne le reste de l’UE.</p>
<p>Limites : valeur brute et non valeur ajoutée ; « Taïwan » correspond au code 490 « Asie n.d.a. » dans BACI. Dépendance : le partenaire fournit au moins ${Math.round(S.meta.dep.share*100)} % des importations d’un produit HS6, pour au moins ${fmt(S.meta.dep.min_k)}.</p>`;

// ---------- accessors ----------
// pk: partner key as stored in F; for a member and EU, "EU27" means rest of the EU
const gEx=(F,y,p)=>sum(get(F,'x',y,p));
const sEx=(F,y,p)=>{const v=get(F,'s',y,p);return v?v[0]:0};
const gIm=(F,y,p)=>get(F,'m',y,p)||0;
const sIm=(F,y,p)=>get(F,'sm',y,p)||0;
const ex=(F,y,p,m=S.mode)=>(m!=='s'?gEx(F,y,p):0)+(m!=='g'?sEx(F,y,p):0);
const im=(F,y,p,m=S.mode)=>(m!=='s'?gIm(F,y,p):0)+(m!=='g'?sIm(F,y,p):0);
function world(F,y,m=S.mode){
  let e=0,i=0;
  const skip=k=>k===EU;
  if(m!=='s'){for(const[k,v]of Object.entries((F.x||{})[y]||{}))if(!skip(k))e+=sum(v);for(const[k,v]of Object.entries((F.m||{})[y]||{}))if(!skip(k))i+=v}
  if(m!=='g'){for(const[k,v]of Object.entries((F.s||{})[y]||{}))if(!skip(k))e+=v[0];for(const[k,v]of Object.entries((F.sm||{})[y]||{}))if(!skip(k))i+=v}
  return {e,i,b:e-i};
}
// pair vectors A <-> B
function pair(y){
  const A=S.curA,B=S.curB,rest=isMem(S.A)&&isEU(S.B);
  const exG=get(A,'x',y,S.B)||[], exS=get(A,'s',y,S.B)||[];
  const imG=(rest?get(B,'xin',y,S.A):get(B,'x',y,S.A))||[];
  const imS=(rest?get(B,'sin',y,S.A):get(B,'s',y,S.A))||[];
  const e=(S.mode!=='s'?sum(exG):0)+(S.mode!=='g'?(exS[0]||0):0);
  let i=(S.mode!=='s'?sum(imG):0)+(S.mode!=='g'?(imS[0]||0):0);
  return {exG,exS,imG,imS,e,i,b:e-i,rest};
}

// ---------- map ----------
const svg=d3.select('#map');
const defs=svg.append('defs');
const SUR=['#e0e0e0','#b3b3b3','#7f7f7f','#424242','#000'];
const DEF_W=[.7,1.3,2.1,3.1,4.3];
DEF_W.forEach((w,i)=>{
  const p=defs.append('pattern').attr('id','h'+i).attr('patternUnits','userSpaceOnUse').attr('width',6).attr('height',6).attr('patternTransform','rotate(45)');
  p.append('rect').attr('width',6).attr('height',6).attr('fill','#fff');
  p.append('line').attr('x1',0).attr('y1',0).attr('x2',0).attr('y2',6).attr('stroke','#000').attr('stroke-width',w);
});
const pa=defs.append('pattern').attr('id','dotA').attr('patternUnits','userSpaceOnUse').attr('width',4).attr('height',4);
pa.append('rect').attr('width',4).attr('height',4).attr('fill','#fff');
pa.append('circle').attr('cx',2).attr('cy',2).attr('r',1.1).attr('fill','#000');
const TH=[1e5,1e6,1e7,1e8];
const bin=a=>a<TH[0]?0:a<TH[1]?1:a<TH[2]?2:a<TH[3]?3:4;
const feats=topojson.feature(S.world,S.world.objects.countries).features.filter(f=>f.id!=='010');
const g=svg.append('g');
function sizeMap(){
  const w=svg.node().getBoundingClientRect().width||960,h=Math.round(w*.5);
  svg.attr('viewBox',`0 0 ${w} ${h}`).attr('height',h);
  const proj=d3.geoEqualEarth().fitExtent([[4,4],[w-4,h-4]],{type:'FeatureCollection',features:feats});
  g.selectAll('path').attr('d',d3.geoPath(proj));
}
g.selectAll('path').data(feats).join('path').attr('class','c')
  .on('click',(ev,f)=>{const k=S.byNum[f.id];if(k)pick(k)})
  .on('mousemove',(ev,f)=>tip(ev,f))
  .on('mouseleave',()=>{tipEl.style.display='none'});
sizeMap();
window.addEventListener('resize',()=>{clearTimeout(window._rs);window._rs=setTimeout(sizeMap,120)});

const tipEl=$('#tip');
function showTip(ev,h){tipEl.innerHTML=h;tipEl.style.display='block';tipEl.style.left=Math.min(ev.clientX+12,window.innerWidth-tipEl.offsetWidth-8)+'px';tipEl.style.top=(ev.clientY+12)+'px'}
function tip(ev,f){
  const k=S.byNum[f.id];
  let h=`<b>${esc(k?name(k):(f.properties&&f.properties.name)||'—')}</b>`;
  if(!k)h+='<br>Pas de données';
  else if(S.A&&S.curA&&k!==S.A&&!(isEU(S.A)&&isMem(k))){
    const e=ex(S.curA,S.y,k),i=im(S.curA,S.y,k);
    h+=`<br>Solde de ${esc(name(S.A))} (${MODE[S.mode]}) : ${fmt(e-i,true)}<br>Exports ${fmt(e)} · Imports ${fmt(i)}`;
  }else if(isEU(S.A)&&isMem(k))h+='<br>Membre de l’UE-27';
  showTip(ev,h);
}
function legend(){
  const L=$('#legend');
  if(!S.A){L.innerHTML='<span class="hint">Cliquez sur un pays pour choisir A, puis sur un second pour B. Le bouton UE-27 sélectionne l’Union européenne comme bloc.</span>';return}
  const sw=f=>`<svg width="26" height="12"><rect width="26" height="12" fill="${f}" stroke="#000" stroke-width=".5"/></svg>`;
  L.innerHTML=`<span class="lbl">Solde de ${esc(name(S.A))} · ${MODE[S.mode]} · Md$</span>
  <span>Excédent</span><span class="sw">${SUR.map(sw).join('')}</span>
  <span>Déficit</span><span class="sw">${DEF_W.map((_,i)=>sw(`url(#h${i})`)).join('')}</span>
  <span class="sub">&lt; 0,1 · 0,1–1 · 1–10 · 10–100 · &gt; 100</span>`;
}
function paint(){
  const A=S.curA,y=S.y;
  const selA=k=>k===S.A||(isEU(S.A)&&isMem(k));
  const selB=k=>k===S.B||(isEU(S.B)&&isMem(k)&&k!==S.A);
  g.selectAll('path').attr('fill',f=>{
    const k=S.byNum[f.id];
    if(!k)return '#fff';
    if(selA(k))return 'url(#dotA)';
    if(!A)return '#e6e6e6';
    const e=ex(A,y,k),i=im(A,y,k);
    if(!e&&!i)return '#fff';
    const b=e-i;
    return b>=0?SUR[bin(b)]:`url(#h${bin(-b)})`;
  }).attr('stroke',f=>{const k=S.byNum[f.id];return selA(k)||selB(k)?'#000':(k?'#fff':'#ccc')})
    .attr('class',f=>{const k=S.byNum[f.id];return 'c'+(selA(k)?' selA':'')+(selB(k)?' selB':'')});
  g.selectAll('path.selA,path.selB').raise();
  legend();
}

// ---------- state ----------
function normalize(){
  if(S.B===S.A)S.B=null;
  if(isEU(S.A)&&isMem(S.B)){const m=S.B;S.B=EU;S.A=m}
}
function pick(k){
  if(!S.A)S.A=k;
  else if(k===S.A)return;
  else if(isEU(S.A)&&isMem(k)){S.A=k;S.B=EU}
  else S.B=k;
  update();
}
function resolve(v){
  v=(v||'').trim().toLowerCase();
  if(!v)return null;
  if(S.byName[v])return S.byName[v];
  const m=sorted.find(c=>c.fr.toLowerCase().startsWith(v));
  return m?m.k:undefined;
}
$('#inA').addEventListener('change',e=>{const k=resolve(e.target.value);if(k===undefined)return;S.A=k;update()});
$('#inB').addEventListener('change',e=>{const k=resolve(e.target.value);if(k===undefined)return;S.B=k;update()});
$('#year').addEventListener('change',e=>{S.y=e.target.value;update()});
$('#swap').addEventListener('click',()=>{if(S.A&&S.B){[S.A,S.B]=[S.B,S.A];update()}});
$('#reset').addEventListener('click',()=>{S.A=null;S.B=null;update()});
$('#eu').addEventListener('click',()=>{if(!S.A||isEU(S.A))S.A=EU;else S.B=EU;update()});
$('#mode').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{S.mode=b.dataset.m;update()}));

function readHash(){
  const p=new URLSearchParams(location.hash.slice(1));
  const a=p.get('a'),b=p.get('b'),y=p.get('y'),m=p.get('m');
  S.A=a&&S.byKey[a]?a:null;
  S.B=b&&S.byKey[b]?b:null;
  if(m&&['g','s','t'].includes(m)&&(m==='g'||S.meta.syears.length))S.mode=m;
  if(y)S.y=y;
}
function writeHash(){
  const p=new URLSearchParams();
  if(S.A)p.set('a',S.A);if(S.B)p.set('b',S.B);p.set('y',S.y);p.set('m',S.mode);
  history.replaceState(null,'','#'+p.toString());
}
window.addEventListener('hashchange',()=>{readHash();update(true)});

let token=0;
async function update(fromHash){
  const t=++token;
  normalize();
  fillYears();
  if(!fromHash)writeHash();
  $('#inA').value=S.A?name(S.A):'';
  $('#inB').value=S.B?name(S.B):'';
  $('#mode').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.m===S.mode));
  $('#eu').classList.toggle('on',isEU(S.A)||isEU(S.B));
  status.textContent=S.A?'Chargement…':'';
  const [A,B]=await Promise.all([load(S.A),load(S.B)]);
  if(t!==token)return;
  S.curA=A;S.curB=B;
  status.textContent='';
  paint();render();
}

// ---------- charts ----------
function chart(el,data,labE,labI){
  const w=el.getBoundingClientRect().width||900;
  const H1=150,H2=110,gap=28,m={l:56,r:8,t:8,b:20};
  const h=m.t+H1+gap+H2+m.b;
  const x=d3.scaleBand().domain(data.map(d=>d.y)).range([m.l,w-m.r]).padding(.18);
  const y1=d3.scaleLinear().domain([0,d3.max(data,d=>Math.max(d.e,d.i))||1]).nice(4).range([m.t+H1,m.t]);
  const bext=d3.max(data,d=>Math.abs(d.b))||1;
  const y2=d3.scaleLinear().domain([-bext,bext]).nice(4).range([m.t+H1+gap+H2,m.t+H1+gap]);
  const s=d3.select(el).html('').append('svg').attr('class','chart').attr('viewBox',`0 0 ${w} ${h}`).attr('height',h);
  s.append('defs').html(`<pattern id="hb" patternUnits="userSpaceOnUse" width="5" height="5" patternTransform="rotate(45)"><rect width="5" height="5" fill="#fff"/><line x1="0" y1="0" x2="0" y2="5" stroke="#000" stroke-width="2"/></pattern>`);
  const fmtAx=v=>v===0?'0':fmt(v);
  const ax=(sc)=>a=>{a.call(d3.axisLeft(sc).ticks(4).tickFormat(fmtAx).tickSize(-(w-m.l-m.r)));a.select('.domain').remove();a.selectAll('line').attr('stroke','#dcdcdc');a.selectAll('text').attr('font-size',10)};
  const sx=x(+S.y);
  if(sx!==undefined)s.append('rect').attr('x',sx-x.step()*x.paddingInner()/2).attr('y',m.t).attr('width',x.step()).attr('height',H1+gap+H2).attr('fill','#f3f3f3');
  s.append('g').attr('transform',`translate(${m.l},0)`).call(ax(y1));
  s.append('g').attr('transform',`translate(${m.l},0)`).call(ax(y2));
  const every=Math.ceil(data.length/(w<500?6:12));
  s.append('g').attr('transform',`translate(0,${m.t+H1+gap+H2})`).call(d3.axisBottom(x).tickValues(data.map(d=>d.y).filter((_,i)=>i%every===0)).tickSize(0).tickPadding(6)).call(a=>{a.select('.domain').remove();a.selectAll('text').attr('font-size',10)});
  const cx=d=>x(d.y)+x.bandwidth()/2;
  s.append('path').attr('d',d3.line().x(cx).y(d=>y1(d.e))(data)).attr('fill','none').attr('stroke','#000').attr('stroke-width',2);
  s.append('path').attr('d',d3.line().x(cx).y(d=>y1(d.i))(data)).attr('fill','none').attr('stroke','#000').attr('stroke-width',1.5).attr('stroke-dasharray','4 3');
  s.append('g').selectAll('rect').data(data).join('rect')
    .attr('x',d=>x(d.y)).attr('width',x.bandwidth())
    .attr('y',d=>y2(Math.max(0,d.b))).attr('height',d=>Math.abs(y2(d.b)-y2(0)))
    .attr('fill',d=>d.b>=0?'#000':'url(#hb)').attr('stroke',d=>d.b>=0?'none':'#000').attr('stroke-width',.5);
  s.append('line').attr('x1',m.l).attr('x2',w-m.r).attr('y1',y2(0)).attr('y2',y2(0)).attr('stroke','#000');
  s.append('text').attr('x',m.l).attr('y',m.t+H1+gap-8).attr('font-size',11).attr('font-weight',700).text('SOLDE');
  const lg=s.append('g').attr('transform',`translate(${w-m.r},${m.t+10})`).attr('font-size',11).attr('text-anchor','end');
  lg.append('text').text('— '+labE);
  lg.append('text').attr('y',14).text('- - '+labI);
  s.append('g').selectAll('rect').data(data).join('rect').attr('x',d=>x(d.y)-x.step()*x.paddingInner()/2).attr('width',x.step()).attr('y',m.t).attr('height',H1+gap+H2).attr('fill','transparent').style('cursor','pointer')
    .on('click',(ev,d)=>{S.y=String(d.y);update()})
    .on('mousemove',(ev,d)=>showTip(ev,`<b>${d.y}</b><br>${esc(labE)} : ${fmt(d.e)}<br>${esc(labI)} : ${fmt(d.i)}<br>Solde : ${fmt(d.b,true)}`))
    .on('mouseleave',()=>{tipEl.style.display='none'});
}

// ---------- panel ----------
const kpi=(l,v,s)=>`<div class="kpi"><div class="lbl">${l}</div><div class="v">${v}</div>${s?`<div class="s">${s}</div>`:''}</div>`;
const prodName=k=>(S.prod&&S.prod[String(k)])||('HS '+String(k).padStart(6,'0'));
function depTable(list,title,na){
  if(na)return `<h3>${title}</h3><div class="empty">${na}</div>`;
  if(!list||!list.length)return `<h3>${title}</h3><div class="empty">Aucune dépendance au-dessus du seuil.</div>`;
  return `<h3>${title}</h3><table><thead><tr><th>Produit (HS6)</th><th class="n">Part</th><th class="n">Valeur</th></tr></thead><tbody>${
    list.map(([k,v,sh])=>`<tr><td>${esc(prodName(k))}<div class="sub">${String(k).padStart(6,'0')}</div></td><td class="n"><b>${sh} %</b></td><td class="n">${fmt(v)}</td></tr>`).join('')}</tbody></table>`;
}
function hubNotes(){
  const H=S.meta.hubs||{};
  return [S.A,S.B].filter(k=>k&&H[k]).map(k=>`<div class="note"><b>Pays hub · ${esc(name(k))}</b>${esc(H[k])}</div>`).join('');
}
function catRows(labels,exv,imv,offset,prefix){
  return labels.map((lab,gi)=>({lab:(prefix||'')+lab,e:exv[gi+offset]||0,i:imv[gi+offset]||0})).filter(r=>r.e+r.i>0).sort((a,b)=>(b.e+b.i)-(a.e+a.i));
}
function catBlock(rows,mx,nA){
  return rows.map(r=>`<div class="cat"><span class="lbl2">${esc(r.lab)}</span><div><div class="bar l"><i style="width:${(r.i/mx*100).toFixed(2)}%"></i></div><div class="sub" style="text-align:right">${fmt(r.i)}</div></div><div><div class="bar r"><i style="width:${(r.e/mx*100).toFixed(2)}%"></i></div><div class="sub">${fmt(r.e)}</div></div><span class="n"><b>${fmt(r.e-r.i,true)}</b></span></div>`).join('');
}

function render(){
  const P=$('#panel'),A=S.curA,B=S.curB,y=S.y;
  if(!S.A||!A){P.innerHTML='';return}
  const nA=esc(name(S.A)),yrs=yearsFor(S.mode),span=`${yrs[0]}–${yrs[yrs.length-1]}`;
  const ml=MODE[S.mode];

  if(!S.B){
    const sw=yrs.map(yy=>({y:yy,...world(A,String(yy))}));
    const cur=world(A,y);
    const keys=new Set();
    for(const f of ['x','m','s','sm'])Object.keys((A[f]||{})[y]||{}).forEach(k=>keys.add(k));
    const rows=[];
    for(const k of keys){if(/^C\d/.test(k)||k===EU)continue;const e=ex(A,y,k),i=im(A,y,k);if(e||i)rows.push({k,e,i,b:e-i})}
    const top=rows.filter(r=>r.b>0).sort((a,b)=>b.b-a.b).slice(0,10);
    const bot=rows.filter(r=>r.b<0).sort((a,b)=>a.b-b.b).slice(0,10);
    const tbl=(rs,t)=>`<h3>${t}</h3><table><thead><tr><th>Partenaire</th><th class="n">Solde</th><th class="n">Échanges</th></tr></thead><tbody>${rs.map(r=>`<tr class="link" data-k="${esc(r.k)}"><td>${esc(name(r.k))}</td><td class="n"><b>${fmt(r.b,true)}</b></td><td class="n">${fmt(r.e+r.i)}</td></tr>`).join('')||'<tr><td colspan="3" class="empty">—</td></tr>'}</tbody></table>`;
    const euLine=isMem(S.A)?(()=>{const e=ex(A,y,EU),i=im(A,y,EU);return e||i?`<tr class="link" data-k="${EU}"><td>Reste de l’UE</td><td class="n"><b>${fmt(e-i,true)}</b></td><td class="n">${fmt(e+i)}</td></tr>`:''})():'';
    P.innerHTML=`<section><h2>${nA} · monde · ${ml} · ${y}</h2>
      <div class="grid kpis">${kpi('Exportations',fmt(cur.e))}${kpi('Importations',fmt(cur.i))}${kpi('Solde',fmt(cur.b,true),cur.i?`Taux de couverture ${nf0.format(cur.e/cur.i*100)} %`:'')}${kpi('Partenaires',nf0.format(rows.length))}</div>${hubNotes()}</section>
      <section><h2>Évolution ${span}</h2><div id="ch"></div></section>
      <section><div class="grid"><div class="col6">${tbl(top,'Principaux excédents')}</div><div class="col6">${tbl(bot,'Principaux déficits')}</div></div>
      ${euLine?`<table style="margin-top:16px"><thead><tr><th>Bloc</th><th class="n">Solde</th><th class="n">Échanges</th></tr></thead><tbody>${euLine}</tbody></table>`:''}
      <p class="hint" style="margin-top:12px">Cliquez sur un partenaire ou sur la carte pour choisir le pays B.</p></section>`;
    chart($('#ch'),sw,'Exportations','Importations');
    P.querySelectorAll('tr.link').forEach(tr=>tr.addEventListener('click',()=>{S.B=tr.dataset.k;update()}));
    return;
  }

  const p=pair(y);
  const nB=p.rest?'reste de l’UE':esc(name(S.B));
  const ser=yrs.map(yy=>{const q=pair(String(yy));return {y:yy,e:q.e,i:q.i,b:q.b}});
  const tot=world(A,y);const totA=tot.e+tot.i;
  const shareA=totA?((p.e+p.i)/totA*100):0;
  const ratio=p.i>0?p.e/p.i:null;

  // service data status
  let qnote='';
  if(S.mode!=='g'){
    const qe=((A.sq||{})[y]||[]).includes(S.B);
    const qi=p.rest?null:((B&&(B.sq||{})[y])||[]).includes(S.A);
    const st=v=>v===null?'non qualifié':v?'déclaré':'estimé par modèle';
    if(!qe||!qi)qnote=`<div class="note"><b>Services · qualité</b>Exports ${nA} → ${nB} : ${st(qe)}. Exports ${nB} → ${nA} : ${st(qi)}. Les valeurs estimées par modèle sont des ordres de grandeur.</div>`;
  }

  // categories
  let cats='';
  const gRows=S.mode!=='s'?catRows(S.meta.groups,p.exG,p.imG,0):[];
  const sRows=S.mode!=='g'?catRows(S.meta.sgroups,p.exS,p.imS,1):[];
  const mx=d3.max([...gRows,...sRows],r=>Math.max(r.e,r.i))||1;
  const hd=`<div class="cat hd"><span class="lbl2">Catégorie</span><span style="text-align:right">Imports de ${nA} ←</span><span>→ Exports de ${nA}</span><span class="n">Solde</span></div>`;
  if(!gRows.length&&!sRows.length)cats='<div class="empty">Aucun échange enregistré cette année.</div>';
  else{
    cats=hd;
    if(gRows.length){if(S.mode==='t')cats+=`<div class="cat sep"><span class="lbl2">Biens</span></div>`;cats+=catBlock(gRows,mx)}
    if(sRows.length){if(S.mode==='t')cats+=`<div class="cat sep"><span class="lbl2">Services</span></div>`;cats+=catBlock(sRows,mx)}
  }

  // dependencies (goods only)
  let deps='';
  if(S.mode!=='s'){
    const dA=get(A,'d',y,S.B)||[];
    const dB=p.rest?null:(get(B,'d',y,S.A)||[]);
    deps=`<section><h2>Dépendances asymétriques · biens</h2>
      <div class="grid"><div class="col6">${depTable(dA,`${nA} dépend de ${nB}`)}</div><div class="col6">${depTable(dB,`${p.rest?'Le reste de l’UE':nB} dépend de ${nA}`,p.rest?'Non calculé pour le reste de l’UE.':'')}</div></div>
      <p class="hint" style="margin-top:12px">Produits pour lesquels un pays achète au moins ${Math.round(S.meta.dep.share*100)} % de ses importations à l’autre. Part = poids du fournisseur dans les importations du produit.</p></section>`;
  }

  P.innerHTML=`<section><h2>${nA} ↔ ${nB} · ${ml} · ${y}</h2>
    <div class="grid kpis">
      ${kpi(`Exports ${nA} → ${nB}`,fmt(p.e))}
      ${kpi(`Exports ${nB} → ${nA}`,fmt(p.i))}
      ${kpi(`Solde de ${nA}`,fmt(p.b,true),ratio?`Taux de couverture ${nf0.format(ratio*100)} %`:'')}
      ${kpi('Poids pour '+nA,nf1.format(shareA)+' %','du commerce total de '+nA)}
    </div>${hubNotes()}${qnote}</section>
    <section><h2>Évolution ${span}</h2><div id="ch"></div></section>
    <section><h2>Par catégorie</h2>${cats}</section>${deps}`;
  chart($('#ch'),ser,`${name(S.A)} → ${p.rest?'reste UE':name(S.B)}`,`${p.rest?'reste UE':name(S.B)} → ${name(S.A)}`);
}
window.addEventListener('resize',()=>{clearTimeout(window._rr);window._rr=setTimeout(render,200)});

readHash();
update(true);
})();
</script>
</body>
</html>
